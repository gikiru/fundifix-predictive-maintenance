# Weekly check that the live API and dashboard answer. Opens an issue if either is down.
# Set repository variables API_URL (for example https://fundifix-api.onrender.com) and DASHBOARD_URL.
name: uptime

on:
  schedule:
    - cron: "0 4 * * 1"        # Mondays 07:00 Nairobi time
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call the live API and dashboard
        id: check
        env:
          API_URL: ${{ vars.API_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          fail=""
          if [ -n "$API_URL" ]; then
            ok=""; for i in $(seq 1 10); do curl -sf "$API_URL/health" && ok=1 && break; sleep 30; done
            [ -z "$ok" ] && fail="$fail API($API_URL)"
          fi
          if [ -n "$DASHBOARD_URL" ]; then
            curl -sfL -o /dev/null "$DASHBOARD_URL" || fail="$fail dashboard($DASHBOARD_URL)"
          fi
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          [ -z "$fail" ] && echo "All services answered."
      - name: Open an issue if something is down
        if: steps.check.outputs.fail != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
              title: `Uptime check failed: ${{ steps.check.outputs.fail }}`,
              body: "The weekly uptime check could not reach the service(s) above. See docs/monitoring_plan.md, section on incident response."})
